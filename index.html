<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EngFit — 모의고사 단어시험 Lv.2 (장문독해)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { font-size: 16px; }
  body { font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: #f1f5f9; min-height: 100vh; }
  .en { font-family: 'Patrick Hand', 'Noto Sans KR', cursive; }
  .wrap { max-width: 440px; margin: 0 auto; padding: 20px 16px 80px; }
  .brand { display: inline-flex; align-items: baseline; gap: 2px; font-family: 'Patrick Hand', cursive; font-size: 1.5rem; letter-spacing: 0.5px; }
  .brand .eng { color: #3b82f6; } .brand .fit { color: #f97316; }
  .brand-sm { font-size: 1.05rem; }
  .hidden { display: none !important; }
  .btn { display: block; width: 100%; padding: 17px; border-radius: 14px; border: none; cursor: pointer; background: linear-gradient(135deg,#3b82f6,#8b5cf6); color: #fff; font-size: 1.1rem; font-weight: 700; font-family: inherit; }
  .btn:disabled { background: #334155; color: #64748b; cursor: default; }
  .btn.ghost { background: #1e293b; border: 1px solid #334155; color: #94a3b8; font-weight: 500; }

  /* ── start ── */
  #start-screen { padding-top: 42px; text-align: center; }
  .badge { font-size: 0.8rem; letter-spacing: 3px; color: #64748b; text-transform: uppercase; margin: 22px 0 8px; }
  #start-screen h1 { font-size: 1.85rem; font-weight: 900; line-height: 1.35; }
  .sub { font-size: 0.92rem; color: #94a3b8; margin-top: 10px; }
  .name-box { margin: 30px 0 16px; text-align: left; }
  .name-box label { font-size: 0.82rem; color: #94a3b8; display: block; margin-bottom: 6px; }
  input[type=text] { width: 100%; padding: 14px 16px; font-size: 1.05rem; border-radius: 12px; border: 1px solid #334155; background: #1e293b; color: #f1f5f9; outline: none; font-family: inherit; }
  input[type=text]:focus { border-color: #3b82f6; }
  .info { margin-top: 22px; padding: 15px 18px; border-radius: 12px; background: rgba(59,130,246,0.08); border: 1px solid rgba(59,130,246,0.15); font-size: 0.83rem; color: #94a3b8; line-height: 1.9; text-align: left; }
  .sec-label { font-size: 0.82rem; color: #94a3b8; display: block; margin: 20px 0 8px; text-align: left; }
  .sec-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .sec-btn { padding: 12px 6px; border-radius: 12px; border: 1.5px solid #334155; background: #1e293b; color: #cbd5e1; cursor: pointer; font-family: inherit; font-size: 0.88rem; font-weight: 500; line-height: 1.35; transition: border-color 0.12s, background 0.12s; }
  .sec-btn .range { display: block; font-size: 0.72rem; color: #64748b; }
  .sec-btn.on { border-color: #3b82f6; background: rgba(59,130,246,0.14); color: #f8fafc; font-weight: 700; }
  .sec-btn.on .range { color: #93c5fd; }

  /* ── quiz ── */
  #topbar { position: sticky; top: 0; z-index: 10; background: rgba(30,41,59,0.96); backdrop-filter: blur(4px); border-bottom: 1px solid #334155; padding: 9px 16px 10px; }
  .topline { display: flex; justify-content: space-between; align-items: center; margin-bottom: 7px; max-width: 440px; margin-left: auto; margin-right: auto; }
  .topline .meta { font-size: 0.8rem; color: #94a3b8; font-variant-numeric: tabular-nums; }
  .pbar { height: 4px; background: #334155; border-radius: 2px; overflow: hidden; max-width: 440px; margin: 0 auto; }
  .pbar > div { height: 100%; width: 0%; background: linear-gradient(90deg,#3b82f6,#8b5cf6); transition: width 0.25s; }
  .qcard { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 26px 20px; margin-bottom: 16px; }
  .qhead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .qno { font-size: 0.78rem; font-weight: 600; letter-spacing: 1px; }
  .qtype { font-size: 0.72rem; font-weight: 500; padding: 3px 9px; border-radius: 6px; }
  .qword { font-weight: 700; line-height: 1.4; word-break: keep-all; }
  .qword.ek { font-family: 'Patrick Hand', cursive; font-size: 2.1em; font-weight: 400; }
  .qword.ke { font-size: 1.65em; }
  .choice { display: flex; align-items: center; gap: 12px; width: 100%; padding: 13px 16px; margin-bottom: 9px; border-radius: 12px; border: 1.5px solid #334155; background: #1e293b; cursor: pointer; text-align: left; color: #cbd5e1; transition: border-color 0.12s, background 0.12s; font-family: inherit; }
  .choice .cnum { flex-shrink: 0; width: 24px; text-align: center; font-size: 1.05rem; color: #94a3b8; }
  .choice .ctext { line-height: 1.45; word-break: keep-all; }
  .choice .ctext.ko { font-size: 0.96em; font-family: 'Noto Sans KR', sans-serif; }
  .choice .ctext.en { font-size: 1.44em; font-family: 'Patrick Hand', cursive; }
  .choice.sel-ek { border-color: #3b82f6; background: rgba(59,130,246,0.14); color: #f8fafc; }
  .choice.sel-ek .cnum { color: #3b82f6; }
  .choice.sel-ke { border-color: #f97316; background: rgba(249,115,22,0.14); color: #f8fafc; }
  .choice.sel-ke .cnum { color: #f97316; }
  #prev-btn { margin-top: 14px; }
  .kbd-hint { text-align: center; font-size: 0.72rem; color: #475569; margin-top: 14px; }

  /* ── result ── */
  #result-screen { padding-top: 30px; }
  .rcard { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 26px 20px; margin-bottom: 14px; text-align: center; }
  .score-big { font-size: 2.6rem; font-weight: 900; margin: 8px 0 2px; background: linear-gradient(135deg,#3b82f6,#8b5cf6); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .score-sub { font-size: 0.95rem; color: #94a3b8; }
  #submit-status { font-size: 0.88rem; margin: 14px 0 4px; min-height: 1.3em; }
  #kakao-btn { margin-top: 10px; background: #fee500; color: #191919; }
  #kakao-btn.done { background: #22c55e; color: #fff; }
  .copy-area { width: 100%; margin-top: 10px; padding: 12px; border-radius: 10px; border: 1px solid #334155; background: #0f172a; color: #cbd5e1; font-size: 0.82rem; line-height: 1.6; font-family: inherit; }
  .wrong-title { font-size: 1rem; font-weight: 700; margin: 24px 0 12px; color: #f8fafc; text-align: left; }
  .witem { background: #1e293b; border: 1px solid #334155; border-left: 4px solid #ef4444; border-radius: 12px; padding: 14px 16px; margin-bottom: 9px; text-align: left; }
  .witem .wq { font-weight: 700; margin-bottom: 5px; }
  .witem .wq .en { font-size: 1.3em; font-weight: 400; }
  .witem .wrow { font-size: 0.86rem; line-height: 1.7; }
  .witem .my { color: #f87171; } .witem .ans { color: #4ade80; font-weight: 600; }
  .witem .wrow .en { font-size: 1.15em; }
  .allok { padding: 26px; text-align: center; color: #4ade80; font-size: 1.05rem; font-weight: 700; }

</head>
<body>

<!-- 시작 화면 -->
<div class="wrap" id="start-screen">
  <span class="brand"><span class="eng">Eng</span><span class="fit">Fit</span></span>
  <div class="badge">Vocabulary · Lv.2 · 모의고사</div>
  <h1>모의고사 단어시험 <span style="color:#f97316">Lv.2</span><br><span style="font-size:0.5em;font-weight:700;color:#94a3b8">장문독해</span></h1>
  <div class="sub" id="start-sub"></div>
  <div class="name-box">
    <label for="name-input">이름</label>
    <input type="text" id="name-input" placeholder="이름을 입력하세요" maxlength="20" autocomplete="off">
  </div>
  <span class="sec-label">영역 선택 (프린트 순서 · 50개씩)</span>
  <div class="sec-grid" id="sec-grid"></div>
  <button class="btn" id="start-btn" disabled style="margin-top:18px">시험 시작</button>
  <div class="info">
    · 단어 프린트 순서 그대로 50개씩 영역 분할<br>
    · 영어→한글, 한글→영어 랜덤 혼합 4지선다<br>
    · 답을 누르면 0.25초 후 자동으로 다음 문제<br>
    · 이전 버튼으로 돌아가서 답 변경 가능 · 키보드 1~4, ←<br>
    · 끝나면 결과가 자동 전송되고, 카톡 복사도 가능해요
  </div>
</div>

<!-- 문제 화면 -->
<div id="quiz-screen" class="hidden">
  <div id="topbar">
    <div class="topline">
      <span class="brand brand-sm"><span class="eng">Eng</span><span class="fit">Fit</span></span>
      <span class="meta" id="prog-text"></span>
      <span class="meta" id="timer">0:00</span>
    </div>
    <div class="pbar"><div id="pfill"></div></div>
  </div>
  <div class="wrap">
    <div class="qcard">
      <div class="qhead">
        <span class="qno" id="qno"></span>
        <span class="qtype" id="qtype"></span>
      </div>
      <div class="qword" id="qword"></div>
    </div>
    <div id="choices"></div>
    <button class="btn ghost" id="prev-btn">← 이전 문제</button>
    <div class="kbd-hint">1 ~ 4 : 답 선택 &nbsp;·&nbsp; ← : 이전 문제</div>
  </div>
</div>

<!-- 결과 화면 -->
<div class="wrap hidden" id="result-screen">
  <div style="text-align:center"><span class="brand"><span class="eng">Eng</span><span class="fit">Fit</span></span></div>
  <div class="rcard" style="margin-top:16px">
    <div style="font-size:0.85rem;color:#94a3b8" id="r-name"></div>
    <div class="score-big" id="r-score"></div>
    <div class="score-sub" id="r-sub"></div>
    <div id="submit-status"></div>
    <button class="btn" id="kakao-btn">📋 결과 복사해서 카톡으로 보내기</button>
    <textarea class="copy-area hidden" id="copy-area" rows="7" readonly></textarea>
  </div>
  <div class="wrong-title" id="wrong-title"></div>
  <div id="wrong-list"></div>
  <button class="btn ghost" id="retry-btn" style="margin-top:18px">다시 풀기</button>
</div>

<script>
"use strict";

/* ══════ 결과 자동 전송 (영핏 공통) ══════ */
var ENGFIT_SUBMIT_URL = "https://script.google.com/macros/s/AKfycbz5IC3cEtaBGW10qZhrjwtjdtGugmcmYb4ZTHS4k-1LOqTRYzW-LfoAPyFB_ShjAqNp/exec";

async function engfitSubmit(r) {
  var body = JSON.stringify(r);
  try {
    var res = await fetch(ENGFIT_SUBMIT_URL, { method: "POST", body: body });
    var j = await res.json();
    return j.ok === true;
  } catch (e) {
    try {
      await fetch(ENGFIT_SUBMIT_URL, { method: "POST", mode: "no-cors", body: body });
      return true;
    } catch (e2) { return false; }
  }
}

var _engfitSent = false;
async function engfitSubmitWithStatus(r) {
  if (_engfitSent) return; _engfitSent = true;
  var el = document.getElementById("submit-status");
  el.textContent = "결과 전송 중...";
  el.style.color = "#94a3b8";
  var ok = await engfitSubmit(r);
  if (ok) { el.textContent = "✓ 결과가 지나티처에게 자동 전송되었어요"; el.style.color = "#4ade80"; }
  else { el.textContent = "전송이 안 됐어요 — 아래 버튼으로 복사해서 카톡으로 보내주세요!"; el.style.color = "#f87171"; }
}

function shuffle(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

/* 영역: 프린트 순서 그대로 50개씩 분할 */
var SEC_SIZE = 50;
var SECTIONS = [];
for (var s = 0; s < WORDS.length; s += SEC_SIZE) {
  SECTIONS.push({ from: s + 1, to: Math.min(s + SEC_SIZE, WORDS.length), words: WORDS.slice(s, s + SEC_SIZE) });
}
var selectedSec = -1;

function buildQuestions(sectionWords) {
  return sectionWords.map(function (w) {
    var ek = Math.random() < 0.5; // true: 영→한
    var answer = ek ? w.ko : w.en;
    var pool = WORDS.filter(function (o) {
      if (o === w) return false;
      if (o.en.toLowerCase() === w.en.toLowerCase()) return false; // 같은 영단어(=같은 뜻) 제외
      if (o.ko === w.ko) return false;                             // 같은 한글 뜻 제외
      return true;
    }).map(function (o) { return ek ? o.ko : o.en; });
    var seen = {}; var uniq = [];
    shuffle(pool).forEach(function (p) { if (!seen[p]) { seen[p] = 1; uniq.push(p); } });
    var options = shuffle([answer].concat(uniq.slice(0, 3)));
    return { ek: ek, q: ek ? w.en : w.ko, answer: answer, options: options, en: w.en, ko: w.ko };
  });
}

function updateStartBtn() {
  $("start-btn").disabled = $("name-input").value.trim().length === 0 || selectedSec < 0;
}

$("name-input").addEventListener("input", updateStartBtn);

  if (e.key === "Enter" && this.value.trim() && selectedSec >= 0) startQuiz();
});
$("start-btn").addEventListener("click", startQuiz);

function secLabel() {
  var sec = SECTIONS[selectedSec];
  return (selectedSec + 1) + "영역 (" + sec.from + "~" + sec.to + ")";
}

function startQuiz() {
  studentName = $("name-input").value.trim();
  if (!studentName || selectedSec < 0) return;
  QS = buildQuestions(SECTIONS[selectedSec].words);
  picked = new Array(QS.length);
  cur = 0;
  startTime = Date.now();
  _engfitSent = false;
  $("start-screen").classList.add("hidden");
  $("result-screen").classList.add("hidden");
  $("quiz-screen").classList.remove("hidden");
  if (timerIv) clearInterval(timerIv);
  timerIv = setInterval(function () {
    var s = Math.floor((Date.now() - startTime) / 1000);
    $("timer").textContent = Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
  }, 1000);
  render();
}

var CIRCLED = ["①", "②", "③", "④"];
var ACC = { ek: "#3b82f6", ke: "#f97316" };

function render() {
  var q = QS[cur];
  var acc = q.ek ? ACC.ek : ACC.ke;
  $("prog-text").textContent = (cur + 1) + " / " + QS.length;
  $("pfill").style.width = ((cur) / QS.length * 100) + "%";
  $("qno").textContent = "Q" + (cur + 1);
  $("qno").style.color = acc;
  var qt = $("qtype");
  qt.textContent = q.ek ? "영→한" : "한→영";
  qt.style.color = acc;
  qt.style.background = acc + "22";
  var qw = $("qword");
  qw.textContent = q.q;
  qw.className = "qword " + (q.ek ? "ek en" : "ke");
  var box = $("choices");
  box.innerHTML = "";
  q.options.forEach(function (opt, i) {
    var b = document.createElement("button");
    b.className = "choice" + (picked[cur] === i ? (q.ek ? " sel-ek" : " sel-ke") : "");
    var num = document.createElement("span");
    num.className = "cnum"; num.textContent = CIRCLED[i];
    var tx = document.createElement("span");
    tx.className = "ctext " + (q.ek ? "ko" : "en");
    tx.textContent = opt;
    b.appendChild(num); b.appendChild(tx);
    b.addEventListener("click", function () { pick(i); });
    box.appendChild(b);
  });
  $("prev-btn").style.visibility = cur === 0 ? "hidden" : "visible";
  window.scrollTo(0, 0);
}

function pick(i) {
  if (locked) return; locked = true;
  picked[cur] = i;
  render(); // show selection highlight
  setTimeout(function () {
    locked = false;
    if (cur < QS.length - 1) { cur++; render(); }
    else finish();
  }, 250);
}

$("prev-btn").addEventListener("click", function () {
  if (locked || cur === 0) return;
  cur--; render();
});

document.addEventListener("keydown", function (e) {
  if ($("quiz-screen").classList.contains("hidden")) return;
  if (e.key >= "1" && e.key <= "4") pick(Number(e.key) - 1);
  else if (e.key === "ArrowLeft" && cur > 0 && !locked) { cur--; render(); }
});

/* ══════ 결과 ══════ */
var lastResult = null;

function finish() {
  clearInterval(timerIv);
  var sec = Math.round((Date.now() - startTime) / 1000);
  var correct = 0, wrongNos = [], wrongs = [], detail = [];
  QS.forEach(function (q, i) {
    var chosen = picked[i] === undefined ? "" : q.options[picked[i]];
    var ok = chosen === q.answer;
    if (ok) correct++;
    else { wrongNos.push(i + 1); wrongs.push({ no: i + 1, q: q, chosen: chosen }); }
    detail.push({ no: i + 1, ok: ok, chosen: chosen, answer: q.answer });
  });
  lastResult = { correct: correct, total: QS.length, sec: sec, wrongs: wrongs, wrongNos: wrongNos };

  $("quiz-screen").classList.add("hidden");
  $("result-screen").classList.remove("hidden");
  $("r-name").textContent = studentName + " · " + secLabel() + " · " + new Date().toLocaleDateString("ko-KR");
  $("r-score").textContent = correct + " / " + QS.length;
  $("r-sub").textContent = Math.round(correct / QS.length * 100) + "% · " + fmtTime(sec);

  var wl = $("wrong-list");
  wl.innerHTML = "";
  if (wrongs.length === 0) {
    $("wrong-title").textContent = "";
    var d = document.createElement("div");
    d.className = "rcard allok";
    d.textContent = "🎉 만점! 전부 정답이에요!";
    wl.appendChild(d);
  } else {
    $("wrong-title").textContent = "❌ 오답 확인 (" + wrongs.length + "개)";
    wrongs.forEach(function (w) {
      var d = document.createElement("div");
      d.className = "witem";
      var qspan = w.q.ek ? '<span class="en">' + esc(w.q.en) + '</span>' : esc(w.q.ko);
      var mySpan = w.chosen === "" ? "(무응답)" : wrapLang(w.chosen, !w.q.ek);
      d.innerHTML = '<div class="wq">Q' + w.no + '. ' + qspan + '</div>' +
        '<div class="wrow">내 답: <span class="my">' + mySpan + '</span><br>' +
        '정답: <span class="ans">' + wrapLang(w.q.answer, !w.q.ek) + '</span>' +
        ' &nbsp;<span style="color:#64748b">(' + '<span class="en">' + esc(w.q.en) + '</span> = ' + esc(w.q.ko) + ')</span></div>';
      wl.appendChild(d);
    });
  }
  window.scrollTo(0, 0);

  engfitSubmitWithStatus({
    quizId: QUIZ_ID,
    quizTitle: QUIZ_TITLE + " — " + secLabel(),
    student: studentName,
    score: correct,
    total: QS.length,
    wrong: wrongNos,
    durationSec: sec,
    detail: detail
  });
}

function wrapLang(text, isEn) {
  return isEn ? '<span class="en">' + esc(text) + '</span>' : esc(text);
}
function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function fmtTime(sec) {
  return Math.floor(sec / 60) + "분 " + (sec % 60) + "초";
}

function buildKakaoText() {
  var r = lastResult;
  var date = new Date().toLocaleDateString("ko-KR");
  var t = "[EngFit " + QUIZ_TITLE + " — " + secLabel() + "]\n";
  t += studentName + " | " + date + "\n";
  t += r.correct + "/" + r.total + " (" + Math.round(r.correct / r.total * 100) + "%) | " + fmtTime(r.sec) + "\n";
  if (r.wrongs.length) {
    t += "\n[오답 " + r.wrongs.length + "개]\n";
    r.wrongs.forEach(function (w, i) { t += (i + 1) + ". " + w.q.en + " = " + w.q.ko + "\n"; });
  } else {
    t += "\n만점! 전부 정답!";
  }
  return t;
}

$("kakao-btn").addEventListener("click", function () {
  var msg = buildKakaoText();
  var btn = $("kakao-btn");
  function done() { btn.textContent = "✓ 복사 완료! 카톡에 붙여넣기 하세요"; btn.classList.add("done"); }
  function fallback() {
    var ta = $("copy-area");
    ta.value = msg;
    ta.classList.remove("hidden");
    ta.focus(); ta.select();
    try { document.execCommand("copy"); done(); } catch (e) {
      btn.textContent = "아래 내용을 길게 눌러 복사하세요";
    }
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(msg).then(done).catch(fallback);
  } else fallback();
});

$("retry-btn").addEventListener("click", function () {
  $("result-screen").classList.add("hidden");
  $("start-screen").classList.remove("hidden");
  $("kakao-btn").textContent = "📋 결과 복사해서 카톡으로 보내기";
  $("kakao-btn").classList.remove("done");
  $("copy-area").classList.add("hidden");
  window.scrollTo(0, 0);
});
</script>
